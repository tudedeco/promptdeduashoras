<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Google Maps Brasil — {{ query }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b0614; color: #eee; }
    #header { position: fixed; z-index: 1000; top: 0; left: 0; right: 0; padding: 8px 14px; background: linear-gradient(90deg, #1b0b2e, #2d0a4f); border-bottom: 1px solid #5b21b6; display: flex; gap: 18px; align-items: center; box-shadow: 0 2px 8px rgba(147,51,234,0.25); }
    #header h1 { font-size: 15px; font-weight: 600; margin: 0; color: #e9d5ff; }
    .stat { font-size: 12px; color: #c4b5fd; }
    .stat b { color: #fff; font-weight: 600; }
    #map { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; }
    .legend { background: rgba(15,10,30,0.92); padding: 8px 10px; border-radius: 6px; border: 1px solid #5b21b6; font-size: 12px; color: #ddd; }
    .legend .sw { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; border: 1px solid #7c3aed; }
  </style>
</head>
<body>
  <div id="header">
    <h1>Brazil sweep — <span style="color:#fff">{{ query }}</span></h1>
    <span class="stat">cells: <b id="s-cells">0</b></span>
    <span class="stat">done: <b id="s-done">0</b></span>
    <span class="stat">subdivided: <b id="s-sub">0</b></span>
    <span class="stat">in progress: <b id="s-prog">0</b></span>
    <span class="stat">pending: <b id="s-pend">0</b></span>
    <span class="stat">places: <b id="s-places">0</b></span>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
